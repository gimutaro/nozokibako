<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>のぞき箱</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: the whole viewport is the glass front of a shadow box; the UI is a few paper labels stuck on that glass. */
:root {
  color-scheme: dark;
  --ink: #0e1026;
  --wall: #2a2f6b;
  --paper: #f3ead7;
  --coral: #ff6b4a;
  --teal: #2fb8a6;
  --sun: #f2b63c;
  --display: "Dela Gothic One", "Hiragino Kaku Gothic StdN", "Yu Gothic", sans-serif;
  --body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--ink);
  color: var(--ink);
  font-family: var(--body);
  font-size: 14px;
  line-height: 1.5;
  overflow: hidden;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
}
#stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#cam { position: fixed; width: 2px; height: 2px; opacity: 0; pointer-events: none; }

.label {
  background: var(--paper);
  border: 2px solid var(--ink);
  box-shadow: 4px 4px 0 var(--ink);
  border-radius: 4px;
}
#brand {
  position: fixed; top: 16px; left: 16px;
  padding: 8px 14px 9px;
  transform: rotate(-2deg);
  max-width: calc(100% - 32px);
}
#brand h1 {
  margin: 0;
  font-family: var(--display);
  font-weight: 400;
  font-size: 22px;
  letter-spacing: 0.06em;
  line-height: 1.2;
}
#brand p { margin: 2px 0 0; font-size: 11px; font-weight: 700; letter-spacing: 0.04em; }

#dock {
  position: fixed; left: 16px; right: 16px; bottom: 16px;
  display: flex; flex-direction: column; align-items: flex-start; gap: 10px;
  pointer-events: none;
}
#dock > * { pointer-events: auto; }
#status {
  margin: 0; padding: 6px 12px;
  font-size: 12px; font-weight: 700;
  max-width: min(100%, 46ch);
  text-wrap: balance;
}
.row { display: flex; flex-wrap: wrap; gap: 8px; }
button {
  font: inherit; font-weight: 700; color: var(--ink);
  min-height: 44px; padding: 0 14px;
  background: var(--paper);
  border: 2px solid var(--ink);
  border-radius: 4px;
  box-shadow: 3px 3px 0 var(--ink);
  cursor: pointer;
}
button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
button[aria-pressed="true"] { background: var(--coral); }
button:focus-visible, input:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }

#settings {
  padding: 12px 14px 14px;
  width: min(100%, 340px);
  display: grid; gap: 10px;
}
#settings { max-height: min(58vh, 440px); overflow-y: auto; }
#settings[hidden] { display: none; }
#settings h2 { margin: 0; font-size: 13px; letter-spacing: 0.08em; }
.field { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: baseline; }
.field label { font-size: 12px; font-weight: 700; }
.field output { font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
.field input[type="range"] { grid-column: 1 / -1; width: 100%; accent-color: var(--coral); height: 28px; margin: 0; }
.checks { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; font-weight: 700; }
.checks label { display: inline-flex; align-items: center; gap: 6px; min-height: 28px; }
.checks input { accent-color: var(--coral); width: 16px; height: 16px; margin: 0; }
.note { margin: 0; font-size: 11px; font-weight: 500; }

#reveal {
  position: fixed; right: 12px; bottom: 12px;
  min-height: 44px; width: 44px; padding: 0;
  opacity: 0.2; display: none;
  background: transparent; border-color: var(--paper); color: var(--paper); box-shadow: none;
}
body.bare #brand, body.bare #dock { display: none; }
body.bare #reveal { display: block; }

@media (max-width: 420px) {
  #brand h1 { font-size: 19px; }
  button { padding: 0 11px; }
}
</style>
</head>
<body>
<canvas id="stage" aria-label="黒い枠の奥の部屋を歩くキャラクター。見る角度によって、手や頭が枠の上にかかって見える"></canvas>
<video id="cam" playsinline muted></video>

<header id="brand" class="label">
  <h1>のぞき箱</h1>
  <p>箱の中から、画面の手前へ。</p>
</header>

<div id="dock">
  <section id="settings" class="label" hidden aria-label="調整">
    <h2>調整</h2>
    <div class="field">
      <label for="set-height">表示部分の高さ（定規で測る）</label><output id="out-height" for="set-height"></output>
      <input id="set-height" type="range" min="4" max="40" step="0.1">
    </div>
    <div class="field">
      <label for="set-dist">目までの距離（ドラッグ・傾き用）</label><output id="out-dist" for="set-dist"></output>
      <input id="set-dist" type="range" min="15" max="90" step="1">
    </div>
    <div class="field">
      <label for="set-gain">視差の強さ（1が実物どおり）</label><output id="out-gain" for="set-gain"></output>
      <input id="set-gain" type="range" min="1" max="2" step="0.05">
    </div>
    <div class="field">
      <label for="set-depth">箱の奥行き</label><output id="out-depth" for="set-depth"></output>
      <input id="set-depth" type="range" min="0.4" max="2.2" step="0.05">
    </div>
    <div class="field">
      <label for="set-fov">カメラの画角（距離の表示が実測と合うまで）</label><output id="out-fov" for="set-fov"></output>
      <input id="set-fov" type="range" min="45" max="95" step="1">
    </div>
    <div class="checks">
      <label for="set-flipx"><input id="set-flipx" type="checkbox">左右を反転</label>
      <label for="set-flipy"><input id="set-flipy" type="checkbox">上下を反転</label>
      <label for="set-anaglyph"><input id="set-anaglyph" type="checkbox">赤青メガネ用に二重描画</label>
    </div>
    <p class="note">高さと距離が実物と合うほど、箱が本物に見えます。</p>
  </section>

  <p id="status" class="label" role="status" aria-live="polite">読み込み中…</p>

  <div class="row" role="group" aria-label="視点の動かし方">
    <button id="mode-pointer" type="button" aria-pressed="true">ドラッグ</button>
    <button id="mode-face" type="button" aria-pressed="false">カメラで顔を追う</button>
    <button id="mode-tilt" type="button" aria-pressed="false">端末の傾き</button>
  </div>
  <div class="row">
    <button id="layout" type="button">見せ方：飛び出し</button>
    <button id="recenter" type="button">正面を合わせる</button>
    <button id="toggle-settings" type="button" aria-expanded="false" aria-controls="settings">調整</button>
    <button id="fullscreen" type="button">全画面</button>
    <button id="hide" type="button">UIを隠す</button>
  </div>
</div>
<button id="reveal" type="button" aria-label="UIを表示">●</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };
  var statusEl = $('status');
  function setStatus(text) { if (statusEl.textContent !== text) statusEl.textContent = text; }

  if (!window.THREE) {
    setStatus('描画ライブラリを読み込めませんでした。通信環境を確認して、ページを読み込み直してください。');
    return;
  }
  var T = window.THREE;

  // ---------- MediaPipe (loaded only when the camera mode starts) ----------
  var MP_VERSION = '0.10.3';
  var MP_BUNDLE = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@' + MP_VERSION + '/vision_bundle.mjs';
  var MP_WASM = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@' + MP_VERSION + '/wasm';
  var MP_MODEL = 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task';
  var IPD_CM = 6.3; // average adult interpupillary distance

  // ---------- settings ----------
  var coarse = window.matchMedia('(pointer: coarse)').matches;
  var smallScreen = Math.min(screen.width, screen.height) < 600;
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var S = {
    cmPerPx: coarse ? (smallScreen ? 0.0163 : 0.0192) : 0.0215, // physical size of one CSS pixel
    dist: coarse ? (smallScreen ? 32 : 45) : 55,                 // assumed eye distance, cm
    depth: 1.0,                                                  // box depth multiplier
    fov: coarse ? 70 : 63,                                       // camera field of view along its long side, degrees
    flipX: false,
    flipY: false,
    layout: 'pop',                                               // 'pop': room behind a black frame that never cuts the character; 'box': room fills the screen
    gain: 1,                                                     // parallax exaggeration
    anaglyph: false
  };
  var STORE_KEY = 'nozokibako-settings-v3';
  function adopt(data) {
    if (!data || typeof data !== 'object') return;
    ['cmPerPx', 'dist', 'depth', 'fov', 'gain'].forEach(function (k) {
      if (typeof data[k] === 'number' && isFinite(data[k]) && data[k] > 0) S[k] = data[k];
    });
    ['flipX', 'flipY', 'anaglyph'].forEach(function (k) { if (typeof data[k] === 'boolean') S[k] = data[k]; });
    if (data.layout === 'pop' || data.layout === 'box') S.layout = data.layout;
  }
  function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) { /* storage unavailable */ } }
  try { adopt(JSON.parse(localStorage.getItem(STORE_KEY) || 'null')); } catch (e) { /* storage unavailable */ }

  // ---------- pure maths (also used by tests) ----------
  // Asymmetric frustum for an eye at (ex, ey, ez) looking through a W x H window centred on the origin at z = 0.
  function offAxisFrustum(ex, ey, ez, W, H, near) {
    var k = near / ez;
    return { left: (-W / 2 - ex) * k, right: (W / 2 - ex) * k, bottom: (-H / 2 - ey) * k, top: (H / 2 - ey) * k };
  }
  // Eye midpoint in camera-centred screen axes (x right, y up, z toward the viewer), in cm,
  // from the two iris-centre landmarks (normalised image coordinates).
  function eyeFromIrises(a, b, vw, vh, fovDeg) {
    var dx = (a.x - b.x) * vw, dy = (a.y - b.y) * vh, dz = ((a.z || 0) - (b.z || 0)) * vw;
    var span = Math.sqrt(dx * dx + dy * dy + dz * dz);
    if (!(span > 1)) return null;
    var f = (Math.max(vw, vh) / 2) / Math.tan(fovDeg * Math.PI / 360);
    var z = f * IPD_CM / span;
    var u = (a.x + b.x) / 2 * vw, v = (a.y + b.y) / 2 * vh;
    return { x: -(u - vw / 2) * z / f, y: -(v - vh / 2) * z / f, z: z };
  }
  // One Euro filter: steady when still, fast when moving.
  function OneEuro(minCutoff, beta) {
    this.minCutoff = minCutoff; this.beta = beta; this.x = null; this.dx = 0;
  }
  OneEuro.prototype.step = function (value, dt) {
    if (this.x === null || !(dt > 0)) { this.x = value; this.dx = 0; return value; }
    var alpha = function (cutoff) { var tau = 1 / (2 * Math.PI * cutoff); return 1 / (1 + tau / dt); };
    var rawDx = (value - this.x) / dt;
    this.dx += alpha(1.0) * (rawDx - this.dx);
    var a = alpha(this.minCutoff + this.beta * Math.abs(this.dx));
    this.x += a * (value - this.x);
    return this.x;
  };
  OneEuro.prototype.reset = function () { this.x = null; this.dx = 0; };
  window.__nozokibako = { offAxisFrustum: offAxisFrustum, eyeFromIrises: eyeFromIrises, OneEuro: OneEuro };

  // ---------- renderer ----------
  var canvas = $('stage');
  var renderer;
  try {
    renderer = new T.WebGLRenderer({ canvas: canvas, antialias: true });
  } catch (e) {
    setStatus('このブラウザではWebGLが使えないため、表示できません。');
    return;
  }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  var scene = new T.Scene();
  scene.background = new T.Color(0x0e1026);
  var camera = new T.PerspectiveCamera();
  scene.add(new T.AmbientLight(0xffffff, 0.5));
  var sunLight = new T.DirectionalLight(0xffffff, 0.5);
  sunLight.position.set(0.5, 0.9, 1.0);
  scene.add(sunLight);

  // ---------- materials ----------
  var INK = 0x14162e;
  var ramp = new T.DataTexture(new Uint8Array([120, 190, 255]), 3, 1, T.LuminanceFormat);
  ramp.minFilter = T.NearestFilter; ramp.magFilter = T.NearestFilter; ramp.generateMipmaps = false; ramp.needsUpdate = true;
  function toon(hex) { return new T.MeshToonMaterial({ color: hex, gradientMap: ramp }); }
  function flat(hex, opts) { return new T.MeshBasicMaterial(Object.assign({ color: hex }, opts || {})); }
  var inkMat = new T.MeshBasicMaterial({ color: 0xf3ead7, side: T.BackSide }); // paper cut-out edge: reads against the dark walls
  // Inverted-hull outline: a back-face copy of the mesh, slightly larger, in paper colour.
  function ink(mesh, k) {
    var hull = new T.Mesh(mesh.geometry, inkMat);
    if (Array.isArray(k)) hull.scale.set(k[0], k[1], k[2]); else hull.scale.setScalar(k || 1.06);
    mesh.add(hull);
    return mesh;
  }
  var M = {
    skin: toon(0xffe1c8), coral: toon(0xff6b4a), teal: toon(0x2fb8a6), cream: toon(0xf6efe0),
    sun: toon(0xf2b63c), leaf: toon(0x79d05f), wood: toon(0xc98f5a)
  };

  function cellTexture(draw) {
    var c = document.createElement('canvas'); c.width = c.height = 256;
    draw(c.getContext('2d'), 256);
    var tex = new T.CanvasTexture(c);
    tex.wrapS = tex.wrapT = T.RepeatWrapping;
    tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
    return tex;
  }
  var texWall = cellTexture(function (g, n) {
    g.fillStyle = '#2a2f6b'; g.fillRect(0, 0, n, n);
    g.strokeStyle = 'rgba(243,234,215,0.7)'; g.lineWidth = 10; g.strokeRect(0, 0, n, n);
  });
  var texCeil = cellTexture(function (g, n) {
    g.fillStyle = '#1f2456'; g.fillRect(0, 0, n, n);
    g.strokeStyle = 'rgba(243,234,215,0.5)'; g.lineWidth = 10; g.strokeRect(0, 0, n, n);
  });
  var texFloor = cellTexture(function (g, n) {
    var h = n / 2;
    g.fillStyle = '#efe2c8'; g.fillRect(0, 0, n, n);
    g.fillStyle = '#d8c39c'; g.fillRect(0, 0, h, h); g.fillRect(h, h, h, h);
  });
  var texSky = (function () {
    var c = document.createElement('canvas'); c.width = 8; c.height = 256;
    var g = c.getContext('2d'), grad = g.createLinearGradient(0, 0, 0, 256);
    grad.addColorStop(0, '#5cc3e6'); grad.addColorStop(0.55, '#bfe8ea'); grad.addColorStop(1, '#ffe6ad');
    g.fillStyle = grad; g.fillRect(0, 0, 8, 256);
    return new T.CanvasTexture(c);
  })();

  // ---------- the character (built 1 unit tall, feet at y = 0) ----------
  function facePatch(geo, mat, dir, r) {
    var m = new T.Mesh(geo, mat);
    var d = new T.Vector3(dir[0], dir[1], dir[2]).normalize();
    m.position.copy(d).multiplyScalar(r);
    m.rotation.order = 'YXZ';
    m.rotation.y = Math.atan2(d.x, d.z);
    m.rotation.x = -Math.asin(d.y);
    return m;
  }
  // The character's own materials mark every pixel it covers (stencil = 1). The black frame is drawn afterwards
  // and skips those pixels, so the frame cuts off the room but never the character.
  function marked(mat) {
    mat.stencilWrite = true; mat.stencilRef = 1; mat.stencilFunc = T.AlwaysStencilFunc; mat.stencilZPass = T.ReplaceStencilOp;
    return mat;
  }
  var HM = {};
  Object.keys(M).forEach(function (k) { HM[k] = marked(M[k].clone()); });
  var heroInk = marked(inkMat.clone());
  function hink(mesh, k) {
    var hull = new T.Mesh(mesh.geometry, heroInk);
    if (Array.isArray(k)) hull.scale.set(k[0], k[1], k[2]); else hull.scale.setScalar(k || 1.06);
    mesh.add(hull);
    return mesh;
  }
  var frameMat = new T.MeshBasicMaterial({ color: 0x000000 });
  frameMat.stencilWrite = true; frameMat.stencilRef = 1; frameMat.stencilFunc = T.NotEqualStencilFunc;

  function buildHero() {
    var root = new T.Group();
    var body = new T.Group(); root.add(body);

    [-1, 1].forEach(function (s) {
      var leg = hink(new T.Mesh(new T.CylinderGeometry(0.034, 0.03, 0.2, 12), HM.cream), [1.32, 1.0, 1.32]);
      leg.position.set(s * 0.062, 0.16, 0); body.add(leg);
      var shoe = hink(new T.Mesh(new T.SphereGeometry(0.056, 16, 12), HM.coral), 1.14);
      shoe.scale.set(1, 0.62, 1.4); shoe.position.set(s * 0.062, 0.036, 0.022); body.add(shoe);
    });

    var poncho = hink(new T.Mesh(new T.CylinderGeometry(0.075, 0.2, 0.3, 28), HM.coral), [1.06, 1.03, 1.06]);
    poncho.position.y = 0.4; body.add(poncho);
    var hem = new T.Mesh(new T.TorusGeometry(0.198, 0.02, 8, 36), HM.sun);
    hem.rotation.x = Math.PI / 2; hem.position.y = 0.262; body.add(hem);
    var collar = new T.Mesh(new T.TorusGeometry(0.078, 0.022, 8, 24), HM.cream);
    collar.rotation.x = Math.PI / 2; collar.position.y = 0.548; body.add(collar);

    var arms = [-1, 1].map(function (s) {
      var pivot = new T.Group(); pivot.position.set(s * 0.09, 0.515, 0); pivot.rotation.z = s * 0.8;
      var arm = hink(new T.Mesh(new T.CylinderGeometry(0.03, 0.026, 0.2, 10), HM.cream), [1.36, 1.0, 1.36]);
      arm.position.y = -0.1; pivot.add(arm);
      var hand = hink(new T.Mesh(new T.SphereGeometry(0.038, 14, 10), HM.skin), 1.2);
      hand.position.y = -0.215; pivot.add(hand);
      body.add(pivot);
      return pivot;
    });

    var head = new T.Group(); head.position.y = 0.755; head.rotation.order = 'YXZ'; body.add(head);
    var skull = hink(new T.Mesh(new T.SphereGeometry(0.2, 32, 24), HM.skin), 1.05);
    skull.scale.set(1, 0.94, 0.96); head.add(skull);
    var hair = hink(new T.Mesh(new T.SphereGeometry(0.213, 32, 20, 0, Math.PI * 2, 0, 1.9), HM.teal), 1.05);
    hair.rotation.x = -0.6; hair.scale.set(1.01, 0.97, 1.0); head.add(hair);

    var sprout = new T.Group(); sprout.position.set(0, 0.185, -0.035); head.add(sprout);
    var stem = new T.Mesh(new T.CylinderGeometry(0.008, 0.008, 0.08, 6), HM.leaf); stem.position.y = 0.04; sprout.add(stem);
    [-1, 1].forEach(function (s) {
      var leaf = hink(new T.Mesh(new T.SphereGeometry(0.05, 12, 8), HM.leaf), 1.18);
      leaf.scale.set(1, 0.26, 0.55); leaf.position.set(s * 0.045, 0.088, 0); leaf.rotation.z = s * 0.5; sprout.add(leaf);
    });

    var eyeMat = marked(flat(0x1a1c3a)), shine = marked(flat(0xffffff));
    var eyes = [-1, 1].map(function (s) {
      var eye = facePatch(new T.CircleGeometry(0.031, 24), eyeMat, [s * 0.37, -0.03, 0.93], 0.203);
      eye.scale.set(0.82, 1.15, 1);
      var glint = new T.Mesh(new T.CircleGeometry(0.0095, 12), shine); glint.position.set(0.009, 0.012, 0.002); eye.add(glint);
      head.add(eye);
      return eye;
    });
    var blush = marked(flat(0xff6b4a, { transparent: true, opacity: 0.42 }));
    [-1, 1].forEach(function (s) {
      head.add(facePatch(new T.CircleGeometry(0.024, 16), blush, [s * 0.62, -0.3, 0.72], 0.202));
    });
    var mouth = facePatch(new T.TorusGeometry(0.017, 0.0048, 6, 12, Math.PI), eyeMat, [0, -0.36, 0.93], 0.2);
    mouth.rotation.z = Math.PI; head.add(mouth);

    return { root: root, body: body, head: head, arms: arms, eyes: eyes, sprout: sprout };
  }
  var hero = buildHero();
  // The stage carries the character and its shadow. It renders after the room and before the black frame.
  var stage = new T.Group(); stage.renderOrder = 5; scene.add(stage);
  stage.add(hero.root);
  hero.root.traverse(function (o) { if (o.isGroup) o.renderOrder = 5; }); // three.js reads the order from the nearest group
  var shadow = new T.Mesh(new T.CircleGeometry(1, 32), flat(INK, { transparent: true, opacity: 0.32, depthWrite: false }));
  shadow.rotation.x = -Math.PI / 2; stage.add(shadow);

  var stars = [0, 1, 2].map(function () {
    var s = ink(new T.Mesh(new T.OctahedronGeometry(1, 0), flat(0xf2b63c)), 1.22);
    scene.add(s); return s;
  });

  // ---------- the box ----------
  var room = null, lamp = null, clouds = [];
  var walk = { x: null, z: 0, i: 0, pause: 0, points: [], cx: 0, floor: 0, speed: 1 };
  var dims = { W: 1, H: 1, D: 1, hero: 1, pop: false, portal: { cx: 0, cy: 0, W: 1, H: 1 }, r: 1, zc: 0, top: 0, star: 1, lim: { x: Infinity, yUp: Infinity, yDown: Infinity } };

  function quad(points, uvs, shades, map, side) {
    var g = new T.BufferGeometry(), pos = [], col = [];
    points.forEach(function (p) { pos.push(p[0], p[1], p[2]); });
    shades.forEach(function (s) { col.push(s, s, s); });
    g.setAttribute('position', new T.Float32BufferAttribute(pos, 3));

  function animate(t, dt) {
    // jump
    if (act.jumpV !== 0 || act.jumpY > 0) {
      act.jumpV -= 9.5 * dt; act.jumpY += act.jumpV * dt;
      if (act.jumpY <= 0) { act.jumpY = 0; act.jumpV = 0; }
    }
    // In the pop layout the character walks between spots, pausing at each.
    var moving = false, dirYaw = 0;
    if (dims.pop && walk.points.length) {
      if (!reduceMotion) {
        if (walk.pause > 0) walk.pause -= dt;
        else {
          var goal = walk.points[walk.i], wx = goal[0] - walk.x, wz = goal[1] - walk.z, wd = Math.hypot(wx, wz), step = walk.speed * dt;
          if (wd <= step) {
            walk.x = goal[0]; walk.z = goal[1]; walk.pause = 4 + Math.random() * 4;
            walk.i = (walk.i + 1 + Math.floor(Math.random() * (walk.points.length - 1))) % walk.points.length;
          } else { walk.x += wx / wd * step; walk.z += wz / wd * step; moving = true; dirYaw = Math.atan2(wx, wz); }
        }
      }
      stage.position.set(walk.cx + walk.x, walk.floor, walk.z);
      stage.updateMatrixWorld();
    }
    var breathe = reduceMotion ? 0 : Math.sin(t * 2.1);
    hero.root.position.y = (act.jumpY + (moving ? Math.abs(Math.sin(t * 10)) * 0.05 : 0)) * dims.hero;
    hero.body.scale.set(1 - breathe * 0.006, 1 + breathe * 0.012, 1 - breathe * 0.006);
    var sh = 0.2 * dims.hero * (1 - Math.min(act.jumpY, 0.5) * 0.9);
    shadow.scale.set(sh, sh, 1);

    // look at the viewer
    headPos.copy(eye); stage.worldToLocal(headPos); // the viewer's eye, in the stage's own upright axes
    var dx = headPos.x, dy = headPos.y - (0.755 + act.jumpY) * dims.hero, dz = headPos.z;
    var yaw = Math.max(-0.95, Math.min(0.95, Math.atan2(dx, dz)));
    var pitch = Math.max(-0.5, Math.min(0.5, Math.atan2(dy, Math.hypot(dx, dz))));
    var k = 1 - Math.exp(-dt * 7);
    act.yaw += (yaw - act.yaw) * k; act.pitch += ((moving ? 0 : pitch) - act.pitch) * k;
    // walking: face the way it is going. standing: turn body and head toward the viewer.
    var turn = (moving ? dirYaw : act.yaw * 0.35) - act.bodyYaw;
    turn = Math.atan2(Math.sin(turn), Math.cos(turn));
    act.bodyYaw += turn * (1 - Math.exp(-dt * 9));
    act.headYaw += ((moving ? 0 : act.yaw * 0.65) - act.headYaw) * k;
    hero.body.rotation.y = act.bodyYaw;
    hero.head.rotation.y = act.headYaw;
    hero.head.rotation.x = -act.pitch;
    hero.head.rotation.z = reduceMotion ? 0 : Math.sin(t * 0.8) * 0.04;
    hero.sprout.rotation.z = reduceMotion ? 0 : Math.sin(t * 3.1) * 0.12 + act.jumpV * 0.05;

    // blink
    if (t > act.blinkAt) { act.blink = 0.14; act.blinkAt = t + 2 + Math.random() * 3.5; }
    var open = 1;
    if (act.blink > 0) { act.blink -= dt; open = Math.max(0.08, Math.abs(act.blink - 0.07) / 0.07); }
    hero.eyes.forEach(function (e) { e.scale.y = 1.15 * open; });

    // wave now and then
    if (!reduceMotion && t > act.waveAt) { act.wave = 1.7; act.waveAt = t + 8 + Math.random() * 6; }
    var armGoal = 0.8;
    if (act.wave > 0) { act.wave -= dt; armGoal = 2.45 + Math.sin(t * 13) * 0.32; }
    var right = hero.arms[1];
    right.rotation.z += (armGoal - right.rotation.z) * (1 - Math.exp(-dt * 12));
    right.rotation.x += ((act.wave > 0 ? 0.75 : 0) - right.rotation.x) * (1 - Math.exp(-dt * 10)); // the waving arm reaches toward the viewer
    hero.arms[0].rotation.z = -0.8 - (reduceMotion ? 0 : Math.sin(t * 2.1) * 0.04);

    // stars: in the box they circle the character; in the pop layout they come out through the window,
    // swing wide in front of the glass (past the window's edge) and go back in
    var st = reduceMotion ? 0.9 : t * 0.55;
    stars.forEach(function (s, i) {
      var a = st + i * Math.PI * 2 / 3, sn = Math.sin(a), cs = Math.cos(a);
      if (dims.pop) {
        var P = dims.portal, k = Math.max(0, Math.min(1, (sn + 0.25) / 1.25)); k = k * k * (3 - 2 * k);
        var rx = 0.36 * P.W + (Math.min(0.46 * dims.W, 0.7 * P.W) - 0.36 * P.W) * k;
        var yBack = P.cy - 0.12 * P.H, yFront = dims.top + 0.4 * dims.hero;
        s.position.set(
          P.cx + cs * rx,
          yBack + (yFront - yBack) * k + 0.03 * dims.hero * Math.sin(st * 2.3 + i * 2),
          sn * (sn >= 0 ? dims.zc + 0.9 * dims.r : 0.7 * dims.D)
        );
      } else {
        s.position.set(
          stage.position.x + cs * Math.min(0.36 * dims.W, 0.9 * dims.hero),
          stage.position.y + dims.hero * (0.58 + 0.13 * Math.sin(st * 2.3 + i * 2)),
          -0.36 * dims.D + sn * 0.5 * dims.D
        );
      }
      s.rotation.set(st * 1.4 + i, st * 1.9 + i, 0);
    });

    if (lamp) lamp.rotation.z = reduceMotion ? 0 : Math.sin(t * 0.9) * 0.05;
    if (!reduceMotion) clouds.forEach(function (c) {
      c.position.x += c.userData.speed * dt;
      if (c.position.x > c.userData.x0 + c.userData.span) c.position.x = c.userData.x0 - c.userData.span;
    });
  }

  // ---------- frame loop ----------
  var needsRoom = true, prev = performance.now();
  function resize() {
    renderer.setSize(window.innerWidth, window.innerHeight, false);
    needsRoom = true; syncControls();
  }
  window.addEventListener('resize', resize);

  function frame(now) {
    var dt = Math.min((now - prev) / 1000, 0.05), t = now / 1000; prev = now;
    if (needsRoom) { buildRoom(); needsRoom = false; }

    if (mode === 'face') {
      sampleFace(now);
      if (face.active && now - face.lastSeen > 1300) {
        target.set(0, 0, S.dist);
        setStatus('顔が見つかりません。カメラに顔が映る位置に戻ってください。');
      }
    } else if (mode === 'pointer' && now - lastPointer > 3500) {
      var d = S.dist;
      if (reduceMotion) setTarget(0.3 * d, 0.16 * d, d * 0.95);
      else setTarget(Math.sin(t * 0.5) * Math.min(0.44 * d, 0.8 * dims.lim.x), (0.1 + Math.sin(t * 0.37 + 1) * 0.2) * Math.min(d, 2.4 * dims.lim.yUp), d * 0.96);
    }
    eye.lerp(target, 1 - Math.exp(-dt * (mode === 'face' ? 28 : 8)));

    animate(t, dt);
    draw();
    window.requestAnimationFrame(frame);
  }

  // ---------- controls ----------
  var fields = {
    height: { el: $('set-height'), out: $('out-height'), get: function () { return window.innerHeight * S.cmPerPx; }, set: function (v) { S.cmPerPx = v / window.innerHeight; }, fmt: function (v) { return v.toFixed(1) + ' cm'; } },
    dist: { el: $('set-dist'), out: $('out-dist'), get: function () { return S.dist; }, set: function (v) { S.dist = v; }, fmt: function (v) { return Math.round(v) + ' cm'; } },
    depth: { el: $('set-depth'), out: $('out-depth'), get: function () { return S.depth; }, set: function (v) { S.depth = v; }, fmt: function (v) { return '×' + v.toFixed(2); } },
    gain: { el: $('set-gain'), out: $('out-gain'), get: function () { return S.gain; }, set: function (v) { S.gain = v; }, fmt: function (v) { return '×' + v.toFixed(2); } },
    fov: { el: $('set-fov'), out: $('out-fov'), get: function () { return S.fov; }, set: function (v) { S.fov = v; }, fmt: function (v) { return Math.round(v) + '°'; } }
  };
  function syncControls() {
    Object.keys(fields).forEach(function (k) {
      var f = fields[k], v = f.get();
      f.el.value = String(v); f.out.textContent = f.fmt(v);
    });
    $('set-flipx').checked = S.flipX; $('set-flipy').checked = S.flipY; $('set-anaglyph').checked = S.anaglyph;
    $('layout').textContent = S.layout === 'pop' ? '見せ方：飛び出し' : '見せ方：箱';
  }
  Object.keys(fields).forEach(function (k) {
    var f = fields[k];
    f.el.addEventListener('input', function () {
      var v = parseFloat(f.el.value);
      if (!isFinite(v)) return;
      f.set(v); f.out.textContent = f.fmt(v); needsRoom = true; save();
    });
  });
  $('set-flipx').addEventListener('change', function (e) { S.flipX = e.target.checked; save(); });
  $('set-flipy').addEventListener('change', function (e) { S.flipY = e.target.checked; save(); });
  $('set-anaglyph').addEventListener('change', function (e) { S.anaglyph = e.target.checked; save(); });
  $('layout').addEventListener('click', function () {
    S.layout = S.layout === 'pop' ? 'box' : 'pop';
    needsRoom = true; syncControls(); save();
  });

  $('toggle-settings').addEventListener('click', function () {
    var panel = $('settings'), open = panel.hidden;
    panel.hidden = !open;
    $('toggle-settings').setAttribute('aria-expanded', String(open));
  });
  $('hide').addEventListener('click', function () { document.body.classList.add('bare'); $('reveal').focus(); });
  $('reveal').addEventListener('click', function () { document.body.classList.remove('bare'); $('hide').focus(); });
  $('fullscreen').addEventListener('click', function () {
    var root = document.documentElement;
    try {
      if (document.fullscreenElement) { document.exitFullscreen(); return; }
      var req = root.requestFullscreen || root.webkitRequestFullscreen;
      if (!req) { setStatus('このブラウザは全画面に対応していません。ホーム画面に追加すると全面表示にできます。'); return; }
      var p = req.call(root);
      if (p && p.catch) p.catch(function () { setStatus('この画面では全画面にできません。'); });
    } catch (e) { setStatus('この画面では全画面にできません。'); }
  });

  // ---------- boot ----------
  function start(data) {
    adopt(data);
    eye.set(0, 0, S.dist); target.copy(eye);
    resize();
    setMode('pointer');
    window.requestAnimationFrame(frame);
  }
  if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(function () { return S; });
  if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
  else start((window.claude && window.claude.hot && window.claude.hot.data) || {});
})();
</script>
</body>
</html>
